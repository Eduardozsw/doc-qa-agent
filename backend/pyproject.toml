[project]
name = "doc-qa-agent-backend"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi", "uvicorn[standard]", "python-multipart", "pydantic-settings", "python-dotenv", "openai", "tiktoken", "pymupdf", "redis", "slowapi", "supabase", "pinecone"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
