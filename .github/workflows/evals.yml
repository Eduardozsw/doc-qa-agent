name: Evals

on: workflow_dispatch

jobs:
  evals:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docqa
          POSTGRES_PASSWORD: docqa
          POSTGRES_DB: docqa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docqa -d docqa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: uv sync --frozen

      - name: Baixar PDF de demonstração
        run: uv run python scripts/fetch_demo_pdf.py

      - name: Rodar evals (check_regression)
        run: uv run python check_regression.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JWT_SECRET: ci
          DATABASE_URL: postgresql://docqa:docqa@localhost:5432/docqa
          REDIS_URL: redis://localhost:6379
